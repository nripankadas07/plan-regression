[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plan-regression"
version = "0.1.0"
description = "Offline PostgreSQL EXPLAIN JSON regression gate with structural change reports."
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Nripanka Das"}]
dependencies = []

[project.scripts]
plan-regression = "plan_regression:main"

[tool.setuptools]
py-modules = ["plan_regression"]
